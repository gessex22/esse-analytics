name: Build macOS app

# Manual: electron-builder no puede compilar para macOS desde Windows/Linux (necesita
# hdiutil/codesign, que solo existen en macOS), así que este build corre en un
# runner macos-latest. Sin certificado de Apple Developer el .app/.dmg queda SIN
# firmar/notarizar (Gatekeeper va a avisar al abrirlo la primera vez) — firmar
# requeriría agregar los secrets CSC_LINK/CSC_KEY_PASSWORD más adelante.
#
# Publica directo a GitHub Releases (release:mac, igual que harías a mano en un
# Mac) — usa el número de versión de electron/package.json: si ya existe un
# release con ese tag (ej. el que subiste vos con el instalador de Windows) le
# agrega el .dmg/.zip de Mac ahí; si no existe, crea uno nuevo. También sube el
# latest-mac.yml que necesita electron-updater para el autoupdate.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias (frontend)
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias (electron)
        working-directory: electron
        run: npm ci

      - name: release:mac (build + publish a GitHub Releases, sin firmar)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # El "directories.output" del package.json es una ruta de Windows
        # (C:/esse-release) pensada para los builds locales — acá se pisa por
        # CLI (npm reenvía lo que va después de "--" al script) sin tocar ese
        # archivo, para no romper el flujo local en la PC.
        run: npm run release:mac -- -c.directories.output=release --x64 --arm64
